<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bakawali Adventure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🌿 BAKAWALI</div>
  <button id="homeBtn">HOME</button>
</header>

<main>
<section id="homeScreen" class="screen">
  <div class="hero">
    <div>
      <p class="eyebrow">WORLD 1</p>
      <h1>Bakawali Forest</h1>
      <p>Help Baku reach the flag! Collect stars and jump over the little forest bugs.</p>
      <button id="startBtn" class="bigBtn">▶ START ADVENTURE</button>
    </div>
    <div class="heroBuddy">🐾</div>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="gameHeader">
    <strong>WORLD 1-1</strong>
    <span>⭐ <b id="score">0</b></span>
    <span>💎 <b id="gems">0</b></span>
    <span>❤️ <b id="lives">3</b></span>
  </div>
  <div class="gameWrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="message" class="message hidden"></div>
    <div class="touch">
      <button id="leftBtn">◀</button>
      <button id="jumpBtn">▲</button>
      <button id="rightBtn">▶</button>
    </div>
  </div>
  <p class="controls">Keyboard: <b>← →</b> move · <b>SPACE / ↑</b> jump</p>
</section>

<section id="winScreen" class="screen hidden">
  <div class="winCard">
    <div class="winIcon">🏁</div>
    <h1>Level Complete!</h1>
    <p>You reached the Bakawali Forest flag.</p>
    <div class="result">⭐ <span id="finalScore">0</span> &nbsp; 💎 <span id="finalGems">0</span></div>
    <button id="againBtn" class="bigBtn">↻ PLAY AGAIN</button>
    <button id="homeWinBtn" class="secondaryBtn">HOME</button>
  </div>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
