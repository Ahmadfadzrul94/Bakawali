<!-- Popup or Arcade Frame -->
<div id="game-modal" style="display:none;">
  <button onclick="closeGame()">Close Game</button>
  <iframe id="game-frame" src="" width="100%" height="600px" style="border:none;"></iframe>
</div>

<script>
  function launchGame(gamePath) {
    document.getElementById('game-frame').src = gamePath;
    document.getElementById('game-modal').style.display = 'block';
  }
  function closeGame() {
    document.getElementById('game-frame').src = '';
    document.getElementById('game-modal').style.display = 'none';
  }
</script>

<!-- Button in your menu -->
<button onclick="launchGame('astraea.html')">Launch Astraea Starfighter</button>
